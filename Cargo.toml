[package]
name = "panoptes"
version = "0.1.0"
edition = "2021"
description = "Screen operation MCP server for AI agents — screenshots plus mouse and keyboard control over Streamable HTTP JSON-RPC"
license = "Apache-2.0"
repository = "https://github.com/yxpil/PANOPTES"
readme = "README.md"
keywords = ["mcp", "screenshot", "mouse", "automation", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "panoptes"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
xcap = "0.9"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
